<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fdf7f2" />

    <!-- iOS still reads these; the manifest alone is not enough on Safari. -->

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The launch screen, which is the seconds this was actually about.
         Without a startup image at the device's exact pixel size, iOS draws a
         white screen for the whole of the launch — before any of this app's
         code runs. Generated by `npx tsx scripts/splash.mts`; flat ground, no
         mark, twelve portrait sizes. Not precached (vite.config): they are
         needed at install, and install happens online. -->
    <link rel="apple-touch-startup-image" href="/splash/640x1136.png"
      media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1242x2208.png"
      media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/828x1792.png"

    <link rel="apple-touch-startup-image" href="/splash/1242x2688.png"

    <link rel="apple-touch-startup-image" href="/splash/1290x2796.png"

    <!--
      Everything from here to the end of the head exists to stop the launch
      being white.

      Do not write the head's own closing tag in this comment, spelled out:
      Vite injects the module script before the first occurrence of that string
      in the file, finds it *inside the comment*, and emits a page whose script
      is commented out. The build succeeds and every suite fails at once.

      The page's own boot is fast — first paint lands in 60ms on a phone-class
      CPU and the whole log comes out of IndexedDB in 6ms — so what was on
      screen for those seconds was never this app working. It was the window
      before it: iOS bringing the web view up, and then a first paint that
      waited on three render-blocking stylesheets, two of them on a host in
      another country. See D-065.
    -->

    <!-- 1. The ground, before any stylesheet resolves. `html` carried no
         background at all, so the canvas was the UA's white until the bundle's
         CSS arrived. The theme follows the clock, not the system setting
         (`themeFor`, 20:00-07:00), so it is picked here the same way rather
         than from prefers-color-scheme, which would flash the wrong one every
         evening. -->
    <style>
      html { background: #fdf7f2; }
      html[data-theme="night"] { background: #171426; }
    </style>
    <script>
      (function () {
        var h = new Date().getHours()
        if (h >= 20 || h < 7) document.documentElement.dataset.theme = 'night'
      })()
    </script>

    <!-- 2. The body font, self-hosted and precached: 64KB of latin and
         latin-ext across the four weights. Inline rather than a stylesheet,
         because a stylesheet — even a local one — is one more thing first paint
         has to wait for. The two weights that carry almost every glyph on
         screen are preloaded so the text does not arrive in system sans and
         swap a frame later. -->
    <link rel="preload" href="/fonts/zen-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/zen-latin-700.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face{font-family:'Zen Maru Gothic';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/zen-latin-400.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
      @font-face{font-family:'Zen Maru Gothic';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/zen-latin-ext-400.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
      @font-face{font-family:'Zen Maru Gothic';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/zen-latin-500.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
      @font-face{font-family:'Zen Maru Gothic';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/zen-latin-ext-500.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
      @font-face{font-family:'Zen Maru Gothic';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/zen-latin-700.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
      @font-face{font-family:'Zen Maru Gothic';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/zen-latin-ext-700.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
      @font-face{font-family:'Zen Maru Gothic';font-style:normal;font-weight:900;font-display:swap;src:url(/fonts/zen-latin-900.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
      @font-face{font-family:'Zen Maru Gothic';font-style:normal;font-weight:900;font-display:swap;src:url(/fonts/zen-latin-ext-900.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
    </style>

    <!-- 3. Google keeps the rest: every non-latin glyph of the body font, and
         the whole icon set. Loaded without blocking the first paint — the
         `print` media is a lie the onload corrects, and it is the one way to
         say "fetch this now, render without it". Still runtime-cached by the
         service worker exactly as before, so offline is unchanged.

         The icon font is NOT subsetted to the names used today: they are passed
         as variables in a dozen places, and a name outside a subset renders as
         its own literal text in the middle of the UI. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block"
      />
    </noscript>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <title>BabyLiana</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
